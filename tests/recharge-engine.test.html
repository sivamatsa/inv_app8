<!doctype html><meta charset="utf-8"><title>Recharge Intelligence engine tests</title>
<!-- Recharge Intelligence engine tests. No Node needed: run in any modern browser.
     How to run: serve the project root (e.g. `python -m http.server 8080` or `node server.js`) and open
     http://localhost:8080/tests/recharge-engine.test.html - the page prints "N checks, 0 failed".
     Covers server/recharge/core/engine.js: the validator / filter / sort / metrics tests ported from the standalone app,
     plus tests for the deliberate changes (price-score normalisation, no invented verified_at, snapshot adapter, freshness)
     and a full payload build from the real bundled snapshots in server/data/*.json (read-only). -->
<pre id="out">running...</pre>
<script type="module">
import * as E from '/server/recharge/core/engine.js';
const results = [];
const t = (name, fn) => { try { const r = fn(); if (r && typeof r.then === 'function') return r.then(() => results.push({ name, pass: true }), (e) => results.push({ name, pass: false, detail: e && e.message })); results.push({ name, pass: true }); } catch (e) { results.push({ name, pass: false, detail: e && e.message }); } };
const eq = (a, b, m) => { if (a !== b) throw new Error((m || 'not equal') + ': got ' + JSON.stringify(a) + ' expected ' + JSON.stringify(b)); };
const ok = (c, m) => { if (!c) throw new Error(m || 'assertion failed'); };

// ---------------------------------------------------------------- ported: planValidator.test.ts
t('validatePlan accepts valid plan with positive price and validity', () => {
  const r = E.validatePlan({ provider: 'Jio', price_inr: 299, validity_days: 28, daily_data_gb: 1.5, calling_unlimited: true, sms_allowance: '100/day', five_g_explicit: true, source_name: 'Jio Official Portal', source_url: 'https://www.jio.com/selfcare/plans/mobility/prepaid-plans-list/', quality_status: 'verified', category: 'daily-data', scope: 'nationwide', verified_at: '2026-10-12T08:00:00.000Z' });
  ok(r); eq(r.provider, 'Jio'); eq(r.price_inr, 299); eq(r.validity_days, 28); eq(r.daily_data_gb, 1.5); eq(r.total_data_gb, 42); eq(r.calling_unlimited, true); eq(r.five_g_explicit, true); eq(r.quality_status, 'verified');
});
t('validatePlan rejects non-positive price or validity', () => {
  eq(E.validatePlan({ provider: 'Airtel', price_inr: 0, validity_days: 28, source_url: 'https://www.airtel.in', verified_at: '2026-10-12T00:00:00Z' }), null);
  eq(E.validatePlan({ provider: 'Airtel', price_inr: 299, validity_days: -5, source_url: 'https://www.airtel.in', verified_at: '2026-10-12T00:00:00Z' }), null);
});
t('validatePlan rejects non-HTTPS or non-whitelisted provider', () => {
  eq(E.validatePlan({ provider: 'UnknownTelecom', price_inr: 299, validity_days: 28, source_url: 'https://example.com', verified_at: '2026-10-12T00:00:00Z' }), null);
  eq(E.validatePlan({ provider: 'Jio', price_inr: 299, validity_days: 28, source_url: 'http://insecure.jio.com', verified_at: '2026-10-12T00:00:00Z' }), null);
});
t('sanitizePlans handles duplicates and tracks failure counts', () => {
  const base = { id: 'plan-1', provider: 'Jio', price_inr: 199, validity_days: 28, source_url: 'https://www.jio.com', quality_status: 'verified', verified_at: '2026-10-12T00:00:00Z' };
  const r = E.sanitizePlans([base, { ...base }, { provider: 'Invalid', price_inr: 100 }]);
  eq(r.plans.length, 1); eq(r.duplicates, 1); eq(r.failures, 1);
});

// ---------------------------------------------------------------- ported: planCalculations.test.ts
const mk = (id, provider, price, validity, daily, total, o) => ({ id, provider, price_inr: price, validity_days: validity, daily_data_gb: daily, total_data_gb: total, calling_unlimited: true, calling_benefit: 'Unlimited', sms_allowance: '100/day', five_g_explicit: true, additional_benefits: [], category: 'daily-data', scope: 'nationwide', source_name: 's', source_url: 'https://x.in', verified_at: '2026-10-20T00:00:00Z', quality_status: 'fixture', ...(o || {}) });
const mock = [mk('jio-299', 'Jio', 299, 28, 1.5, 42), mk('airtel-349', 'Airtel', 349, 28, 1.5, 42), mk('bsnl-199', 'BSNL', 199, 30, 2, 60, { five_g_explicit: false })];
const F = E.DEFAULT_FILTERS; const W = E.DEFAULT_WEIGHTS;
t('filterPlans by provider and price', () => { eq(E.filterPlans(mock, { ...F, provider: 'Jio' }).length, 1); eq(E.filterPlans(mock, { ...F, maxPrice: 300 }).length, 2); });
t('filterPlans by 5G', () => { const r = E.filterPlans(mock, { ...F, fiveg: 'yes' }); eq(r.length, 2); ok(r.every((p) => p.five_g_explicit === true)); });
t('sortPlans price and cost-day', () => { const a = E.sortPlans(mock, 'price-asc'); eq(a[0].price_inr, 199); eq(a[a.length - 1].price_inr, 349); eq(E.sortPlans(mock, 'cost-day')[0].provider, 'BSNL'); });
t('calculateMetrics', () => { const m = E.calculateMetrics(mock, W); eq(m.count, 3); eq(m.lowestPrice, 199); eq(m.longestValidity, 30); ok(m.bestValue && m.bestValue.score > 0); });

// ---------------------------------------------------------------- new: filters not covered above
t('min daily / min total exclude plans with unknown data (null is not zero)', () => {
  const withNull = [...mock, mk('x', 'Vi', 199, 28, null, null)];
  eq(E.filterPlans(withNull, { ...F, minDaily: 1 }).length, 3); eq(E.filterPlans(withNull, { ...F, minTotal: 1 }).length, 3);
});
t('calling / sms tri-state and category filters', () => {
  const p = [mk('a', 'Jio', 100, 10, 1, 10, { calling_unlimited: null, sms_allowance: null, category: 'voice-only' }), ...mock];
  eq(E.filterPlans(p, { ...F, calling: 'yes' }).length, 3); eq(E.filterPlans(p, { ...F, calling: 'no' }).length, 1);
  eq(E.filterPlans(p, { ...F, sms: 'no' }).length, 1); eq(E.filterPlans(p, { ...F, category: 'voice-only' }).length, 1);
  eq(E.filterPlans(p, { ...F, search: '299' }).length, 1); eq(E.filterPlans(p, { ...F, minValidity: 29 }).length, 1); eq(E.filterPlans(p, { ...F, maxValidity: 10 }).length, 1);
});

// ---------------------------------------------------------------- new: deliberate change 1 (price score)
t('price efficiency discriminates: cheapest per day scores highest, costliest scores 0', () => {
  const b = E.computeBounds(mock); const pr = (p) => E.calculatePlanScore(p, b, { price: 1, validity: 0, data: 0, calling: 0, sms: 0 }).totalScore;
  const [jio, airtel, bsnl] = mock.map(pr);
  ok(bsnl > jio && jio > airtel, `scores ${bsnl}/${jio}/${airtel}`); eq(airtel, 0, 'costliest per day');
});
t('weights re-normalise across available dimensions (unknown data is not penalised)', () => {
  const withData = mk('d', 'Jio', 299, 28, 1.5, 42); const noData = mk('n', 'Jio', 299, 28, null, null, { calling_unlimited: null, sms_allowance: null });
  const b = E.computeBounds([withData, noData]);
  const s = E.calculatePlanScore(noData, b, W); eq(s.effectiveWeightSum, W.price + W.validity, 'only price+validity active');
  ok(s.totalScore > 0); eq(s.components.dataAllowance.contribution, 0);
});
t('score is null for invalid plan; zero weights give 0', () => {
  eq(E.calculatePlanScore({ price_inr: 0, validity_days: 5 }, E.computeBounds(mock), W), null);
  eq(E.calculatePlanScore(mock[0], E.computeBounds(mock), { price: 0, validity: 0, data: 0, calling: 0, sms: 0 }).totalScore, 0);
});
t('value-score sort follows the weights', () => {
  const priceOnly = E.sortPlans(mock, 'value-score', { price: 1, validity: 0, data: 0, calling: 0, sms: 0 }); eq(priceOnly[0].id, 'bsnl-199');
  const validityOnly = E.sortPlans(mock, 'value-score', { price: 0, validity: 1, data: 0, calling: 0, sms: 0 }); eq(validityOnly[0].id, 'bsnl-199');
});

// ---------------------------------------------------------------- new: deliberate change 2 (no invented verified_at)
t('validatePlan rejects a missing or unparseable verified_at (never defaults to now)', () => {
  const base = { provider: 'Jio', price_inr: 299, validity_days: 28, source_url: 'https://www.jio.com', quality_status: 'verified' };
  eq(E.validatePlan(base), null); eq(E.validatePlan({ ...base, verified_at: 'not a date' }), null); ok(E.validatePlan({ ...base, verified_at: '2026-10-12T00:00:00Z' }));
});
t('freshness helpers', () => {
  const day = 86400000; const now = Date.parse('2026-10-25T00:00:00Z');
  eq(E.snapshotAgeDays({ verified_at: '2026-10-12T08:00:00.000Z' }, now), 12); eq(E.snapshotAgeDays({ verified_at: 'x' }, now), null);
  eq(E.freshnessLevel(12), 'fresh'); eq(E.freshnessLevel(31), 'aging'); eq(E.freshnessLevel(91), 'stale'); eq(E.freshnessLevel(null), 'unknown');
});

// ---------------------------------------------------------------- new: snapshot adapter + payload from the real bundled data
t('normalizeSnapshotPlan maps stated fields and keeps unknowns null', () => {
  const r = E.normalizeSnapshotPlan({ id: 'jio-1899-336d', provider: 'Jio', price: 1899, validityDays: 336, dailyDataGB: null, totalDataGB: 24, calling: 'Unlimited Voice Calls', sms: 'Not included in pack', is5GEligible: false, additionalBenefits: ['A'], category: 'long_validity', circleScope: 'National', sourceName: 'S', sourceUrl: 'https://www.jio.com', verifiedAt: '2026-10-12T08:00:00.000Z', verificationStatus: 'verified' });
  eq(r.daily_data_gb, null); eq(r.total_data_gb, 24); eq(r.calling_unlimited, true); eq(r.sms_allowance, null); eq(r.five_g_explicit, false); eq(r.category, 'long-validity'); eq(r.scope, 'nationwide'); eq(r.circle_name, null); eq(r.quality_status, 'verified');
  eq(E.normalizeSnapshotPlan({ id: 'x', provider: 'Vi', price: 99, validityDays: 10, calling: '', sms: '' }).calling_unlimited, null);
});
const fetchJson = async (u) => (await fetch(u)).json();
await t('payload from the real bundled snapshots', async () => {
  const snapshots = {}; for (const k of ['jio', 'airtel', 'vi', 'bsnl']) snapshots[k] = await fetchJson('/server/data/' + k + '.json');
  const total = Object.values(snapshots).reduce((n, a) => n + a.length, 0);
  const now = Date.parse('2026-10-25T00:00:00Z');
  const p = E.buildRechargePayload({ snapshots, now, pings: { jio: { reachable: true, status: 200, latency: 120 }, airtel: { reachable: true, status: 200, latency: 90 }, vi: { reachable: true, status: 403, latency: 80 }, bsnl: { reachable: false, status: 0, latency: 3500, error: 'timeout' } } });
  eq(p.plans.length, total, 'all snapshot plans valid'); eq(p.diagnostics.validation_failures, 0); eq(p.diagnostics.duplicate_count, 0); eq(p.mode, 'bundled_snapshot'); ok(p.ok);
  eq(p.sources.length, 4); eq(p.sources.find((s) => s.provider === 'Vi').http_status, 403); eq(p.sources.find((s) => s.provider === 'BSNL').site_reachable, false); eq(p.sources.find((s) => s.provider === 'Jio').snapshot_age_days, 12);
  ok(p.plans.every((x) => x.quality_status === 'verified' && x.source_url.startsWith('https://')));
  ok(p.plans.filter((x) => x.daily_data_gb === null).length > 0 && p.plans.every((x) => x.total_data_gb > 0), 'unknown daily stays null');
  eq(p.diagnostics.warnings.length, 0, 'fresh data has no warnings'); ok(/not fetched live/.test(p.diagnostics.message));
  const m = E.calculateMetrics(p.plans, E.DEFAULT_WEIGHTS); eq(m.count, total); ok(m.bestValue.score > 0 && m.lowestPrice > 0);
  const sorted = E.sortPlans(p.plans, 'value-score', E.DEFAULT_WEIGHTS); ok(E.calculatePlanScore(sorted[0], E.computeBounds(p.plans), E.DEFAULT_WEIGHTS).totalScore >= E.calculatePlanScore(sorted[sorted.length - 1], E.computeBounds(p.plans), E.DEFAULT_WEIGHTS).totalScore);
  const later = E.buildRechargePayload({ snapshots, now: Date.parse('2027-02-25T00:00:00Z') }); ok(later.diagnostics.warnings.some((w) => /days old/.test(w)), 'stale data warns'); eq(later.sources[0].site_reachable, null, 'no ping => unknown, not false');
});
t('empty / broken snapshots produce an honest empty payload', () => {
  const p = E.buildRechargePayload({ snapshots: { jio: [], airtel: [{ junk: true }] }, now: Date.now() });
  eq(p.ok, false); eq(p.plans.length, 0); ok(p.diagnostics.warnings.length >= 1);
});

const failed = results.filter((r) => !r.pass);
window.__results = { total: results.length, failed: failed.length, failures: failed };
document.getElementById('out').textContent = `${results.length} checks, ${failed.length} failed\n` + failed.map((f) => '✗ ' + f.name + ' :: ' + f.detail).join('\n');
</script>
