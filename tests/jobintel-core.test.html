<!doctype html><meta charset="utf-8"><title>Job Intelligence core tests</title>
<!-- Job Intelligence server-core tests (75 checks). No Node needed: they run in any modern browser.
     How to run: serve the project root (e.g. `python -m http.server 8080` or `node server.js`) and open
     http://localhost:8080/tests/jobintel-core.test.html - the page prints "N checks, 0 failed".
     They exercise server/jobintel/core/* (store, handlers, dedupe, connectors' flags, Gemini fallbacks)
     with an in-memory persistence adapter and stub connectors: no network, no Supabase, no real data. -->
<pre id="out">running...</pre>
<script type="module">
const results = [];
const ok = (name, cond, detail) => results.push({ name, pass: !!cond, detail: cond ? undefined : String(detail === undefined ? '' : detail).slice(0, 300) });
const B = '/server/jobintel/core/';
const mods = {};
for (const p of ['deduplicator.js', 'gemini.js', 'store.js', 'handlers.js', 'connectors/greenhouse.js', 'connectors/remoteok.js', 'connectors/remotive.js', 'connectors/jobicy.js', 'connectors/arbeitnow.js', 'connectors/search_discovery.js']) {
  try { mods[p] = await import(B + p); ok('import ' + p, true); } catch (e) { ok('import ' + p, false, e && e.message); }
}
async function main() {
  const D = mods['deduplicator.js'], S = mods['store.js'], H = mods['handlers.js'], G = mods['gemini.js'], SD = mods['connectors/search_discovery.js'];
  if (!D || !S || !H || !G) return;

  // ---- SHA-256 hand implementation vs WebCrypto
  const samples = [['Senior Engineer', 'Acme Inc.', 'Build things. '.repeat(40)], ['Données ✓ Ünïcode', 'Société Générale', 'Développeur — 日本語 text ' + 'x'.repeat(500)], ['', '', '']];
  for (const [t, c, d] of samples) {
    const norm = `${D.normalizeTitle(t)}|${D.normalizeCompanyName(c)}|${d.slice(0, 400).toLowerCase().replace(/\s+/g, ' ')}`;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(norm));
    const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
    ok('sha256 matches WebCrypto for ' + JSON.stringify(t).slice(0, 20), D.generateContentHash(t, c, d) === hex, D.generateContentHash(t, c, d) + ' vs ' + hex);
  }

  // ---- store with in-memory persistence and stub connectors
  let saved = null, saves = 0;
  const persistence = { load: async () => null, save: async (st) => { saved = JSON.parse(JSON.stringify(st)); saves++; } };
  const raw = (i, extra) => Object.assign({ external_job_id: 'ext-' + i, source_id: 'stub', source_name: 'Stub Board', source_type: 'job_board_api', title: 'Software Engineer ' + i, company: 'Co ' + (i % 3), location: 'Remote', remote_mode: 'remote', employment_type: 'full-time', skills: ['js', 'ts'], description: 'Desc number ' + i + ' ' + 'z'.repeat(60), original_url: 'https://example.com/j/' + i, posted_at: new Date().toISOString() }, extra || {});
  const stub = (id, jobs, fail) => async () => ({ source_id: id, source_name: id, success: !fail, jobs: fail ? [] : jobs, error: fail ? 'boom' : undefined, duration_ms: 1 });
  const connectors = { greenhouse: stub('greenhouse', [raw(1), raw(2)]), remoteok: stub('remoteok', [raw(2, { source_id: 'remoteok' }), raw(3)]), remotive: stub('remotive', [], true), jobicy: stub('jobicy', [raw(4)]), arbeitnow: stub('arbeitnow', []), search_discovery: stub('search_discovery', [raw(99, { source_id: 'search_discovery', synthetic: true })]) };
  const store = new S.JobIntelStore({ persistence, connectors });
  await store.init();
  ok('init bootstraps sources', store.getSources().length >= 6, store.getSources().length);
  ok('init seeds profiles', store.getSearchProfiles().length >= 3, store.getSearchProfiles().length);
  const sd = store.getSources().find((s) => s.id === 'search_discovery');
  ok('synthetic connector disabled by default', sd && sd.enabled === false, JSON.stringify(sd && sd.enabled));
  ok('no network/discovery at init (no jobs)', store.getJobs().length === 0, store.getJobs().length);

  const run = await store.executeLiveDiscovery('engineer');
  ok('discovery ran enabled connectors only', run.status === 'completed' || run.status === 'failed', JSON.stringify(run));
  ok('discovery added jobs & merged duplicates', store.getJobs().length >= 3 && run.duplicates_merged >= 0, JSON.stringify({ n: store.getJobs().length, run }));
  ok('synthetic jobs NOT ingested while disabled', !store.getJobs().some((j) => j.is_synthetic), '');
  ok('failed connector marks its source unhealthy (original behaviour)', store.getSources().find((x) => x.id === 'remotive').status === 'error', JSON.stringify(store.getSources().find((x) => x.id === 'remotive')));
  let busy = false; const p1 = store.executeLiveDiscovery('a'); try { await store.executeLiveDiscovery('b'); } catch (e) { busy = e.code === 'DISCOVERY_RUNNING'; } await p1;
  ok('concurrent discovery refused', busy, '');

  // enable synthetic -> synthetic flag carried
  store.updateSource('search_discovery', { enabled: true });
  await store.executeLiveDiscovery('x');
  ok('synthetic jobs carry is_synthetic when enabled', store.getJobs().some((j) => j.is_synthetic === true), '');

  await store.flush(); ok('persisted to injected adapter', saved && Array.isArray(saved.jobs) && saved.jobs.length > 0 && saves > 0, saves);

  // ---- handlers via dispatch
  const call = (method, pathname, body, query) => H.dispatch({ store, method, pathname, query: query || {}, body });
  let r = await call('GET', '/health'); ok('GET /health 200', r.status === 200, JSON.stringify(r));
  r = await call('GET', '/jobs'); ok('GET /jobs returns array', r.status === 200 && Array.isArray(r.body) && r.body.length > 2, JSON.stringify(r).slice(0, 120));
  const jobId = r.body[0].id;
  r = await call('GET', '/jobs/' + jobId); ok('GET /jobs/:id', r.status === 200 && r.body.id === jobId, r.status);
  r = await call('GET', '/jobs/nope'); ok('GET unknown job 404', r.status === 404, r.status);
  r = await call('GET', '/jobs', undefined, { query: 'engineer', limit: '2' }); ok('jobs filter+limit', r.status === 200 && r.body.length <= 2, r.body && r.body.length);

  // upsert semantics and hardening
  r = await call('POST', '/applications', { id: 'app-test-1', company: 'Acme', role: 'Dev', status: 'Applied', evil: 'x', __proto__: { polluted: 1 } });
  ok('POST application creates (201) with client id', (r.status === 201 || r.status === 200) && r.body.id === 'app-test-1', JSON.stringify(r).slice(0, 160));
  ok('unknown keys dropped', r.body && r.body.evil === undefined, JSON.stringify(r.body).slice(0, 160));
  ok('no prototype pollution', ({}).polluted === undefined, '');
  r = await call('POST', '/applications', { id: 'app-test-1', company: 'Acme', role: 'Dev II', status: 'Screening' });
  ok('POST same id = update, not duplicate', store.getApplications().filter((a) => a.id === 'app-test-1').length === 1 && store.getApplicationById('app-test-1').role === 'Dev II', store.getApplications().length);
  r = await call('POST', '/applications', { id: 'app-test-1', status: 'Interviewing' }); ok('unknown application status rejected (400)', r.status === 400 && store.getApplicationById('app-test-1').status === 'Screening', JSON.stringify(r).slice(0, 120));
  r = await call('PUT', '/applications/app-test-1', { status: '' }); ok('empty status on PUT rejected (400)', r.status === 400, r.status);
  r = await call('POST', '/applications', { id: '../../etc/passwd', company: 'Bad', role: 'x' });
  ok('unsafe client id replaced by server id', r.body && /^[A-Za-z0-9_.:-]+$/.test(r.body.id) && r.body.id !== '../../etc/passwd', JSON.stringify(r.body && r.body.id));
  r = await call('PUT', '/applications/app-test-1', { id: 'hijack', role: 'Dev III' });
  ok('PUT ignores body.id', r.status === 200 && r.body.id === 'app-test-1' && r.body.role === 'Dev III', JSON.stringify(r).slice(0, 140));
  r = await call('POST', '/applications/app-test-1/status', { status: 'Offer', note: 'great' });
  ok('POST status change', r.status === 200 && r.body.status === 'Offer', JSON.stringify(r).slice(0, 140));
  r = await call('POST', '/applications/app-test-1/status', {}); ok('status required 400', r.status === 400, r.status);
  r = await call('POST', '/applications', 'notanobject'); ok('non-object body 400', r.status === 400, r.status);

  r = await call('POST', '/interviews', { application_id: 'app-test-1', company: 'Acme', role: 'Dev', round_name: 'R1', date: new Date().toISOString(), status: 'Scheduled' });
  ok('POST interview 201', r.status === 201 || r.status === 200, r.status);
  const nFollow = store.getFollowUps().length; const intId = r.body.id;
  await call('POST', '/interviews', Object.assign({}, r.body)); ok('re-POST interview does not duplicate follow-up', store.getFollowUps().length === nFollow, nFollow + ' -> ' + store.getFollowUps().length);
  r = await call('POST', '/followups', { id: 'fu-1', title: 'ping', status: 'Pending', due_date: new Date().toISOString() }); ok('followup create', r.status < 300, r.status);
  r = await call('POST', '/followups', { id: 'fu-1', title: 'ping', status: 'Completed' }); ok('followup toggle via POST upsert', store.getFollowUps().filter((f) => f.id === 'fu-1').length === 1 && store.getFollowUps().find((f) => f.id === 'fu-1').status === 'Completed', '');
  r = await call('POST', '/recruiters', { id: 'rec-1', name: 'Pat', email: 'p@x.com' }); ok('recruiter create', r.status < 300, r.status);
  r = await call('POST', '/offers', { id: 'off-1', company: 'Acme', role: 'Dev', base_salary: 100, total_ctc: 120, currency: 'USD', status: 'Received' }); ok('offer create', r.status < 300, r.status);
  r = await call('POST', '/documents', { id: 'doc-1', name: 'cv', content: 'resume text' }); ok('document create', r.status < 300, r.status);
  r = await call('POST', '/search-profiles', { id: 'sp-x', name: 'X', keywords: ['a'] }); ok('profile create (defaults arrays)', r.status < 300 && Array.isArray(r.body.related_keywords), JSON.stringify(r.body).slice(0, 100));
  r = await call('GET', '/profiles'); ok('profiles alias', r.status === 200 && r.body.some((p) => p.id === 'sp-x'), r.status);
  r = await call('GET', '/companies'); const cid = r.body[0] && r.body[0].id; ok('companies list', r.status === 200 && cid, r.status);
  r = await call('POST', '/companies/' + cid + '/watch', { watched: true }); ok('company watch', r.status === 200, r.status);
  r = await call('POST', '/companies/' + cid + '/mute', { muted: true }); ok('company mute', r.status === 200, r.status);
  r = await call('GET', '/sources'); ok('sources list', r.status === 200 && r.body.length >= 6, r.status);
  r = await call('POST', '/sources/greenhouse/sync'); ok('single source sync', r.status === 200, JSON.stringify(r).slice(0, 140));
  r = await call('POST', '/sources/nope/sync'); ok('sync unknown source 404', r.status === 404, r.status);
  r = await call('GET', '/discovery/runs'); ok('runs list', r.status === 200 && r.body.length >= 2, r.status);
  r = await call('GET', '/discovery/status'); ok('status has is_running boolean', r.status === 200 && typeof r.body.is_running === 'boolean', JSON.stringify(r.body).slice(0, 100));
  r = await call('POST', '/discovery/trigger', { query: 'q', searchProfileId: 'sp-x' }); ok('discovery trigger returns summary', r.status === 200 && r.body.summary && typeof r.body.summary.jobs_scanned === 'number', JSON.stringify(r).slice(0, 160));
  r = await call('GET', '/notifications'); ok('notifications list', r.status === 200 && Array.isArray(r.body), r.status);
  const nid = r.body[0] && r.body[0].id; r = await call('POST', '/notifications/' + nid + '/read'); ok('mark read', r.status === 200, r.status);
  r = await call('POST', '/notifications/read-all'); ok('read-all', r.status === 200, r.status);
  r = await call('POST', '/notifications/mark-all-read'); ok('mark-all-read alias', r.status === 200, r.status);
  r = await call('GET', '/analytics'); ok('analytics shape', r.status === 200 && typeof r.body.total_applications === 'number' && r.body.funnel && Array.isArray(r.body.top_skills), JSON.stringify(r.body).slice(0, 120));
  ok('avg response days is derived, not a constant', r.body.avg_response_days === null || (typeof r.body.avg_response_days === 'number' && r.body.avg_response_days !== 3.5), String(r.body.avg_response_days));
  { const t0 = Date.parse('2026-01-01T00:00:00Z'); store.saveApplication({ id: 'app-resp-1', company: 'R', role: 'R', status: 'Screening', timeline: [{ id: 'e1', timestamp: new Date(t0).toISOString(), status: 'Applied' }, { id: 'e2', timestamp: new Date(t0 + 2 * 86400000).toISOString(), status: 'Screening' }] });
    r = await call('GET', '/analytics'); ok('avg response days computed from timelines', typeof r.body.avg_response_days === 'number' && r.body.avg_response_days > 0, String(r.body.avg_response_days)); store.deleteApplication && store.deleteApplication('app-resp-1'); }
  r = await call('GET', '/export'); ok('export object', r.status === 200 && r.body && Array.isArray(r.body.jobs) && r.body.applications, JSON.stringify(Object.keys(r.body || {})));
  const exp = r.body;
  r = await call('POST', '/import', { applications: [{ company: 'Imp', role: 'R', status: 'Applied' }], interviews: [], offers: [] }); ok('import applications', r.status === 200 && r.body.success, JSON.stringify(r).slice(0, 120));
  r = await call('POST', '/import', { applications: [{ company: 'WeirdCo', role: 'R', status: 'Weird' }], interviews: [], offers: [] }); ok('import maps unknown status to Saved', r.status === 200 && store.getApplications().filter((x) => x.company === 'WeirdCo').every((x) => x.status === 'Saved'), JSON.stringify(r).slice(0, 100));
  r = await call('POST', '/import', { applications: [{ company: 'Imp'.repeat(10000) }] }); ok('import oversize string handled (capped, not crash)', r.status === 200 || r.status === 400, r.status);
  r = await call('PATCH', '/jobs/' + jobId, { status: 'saved', id: 'hijack' }); ok('PATCH job ignores id', r.status === 200 && r.body.id === jobId, JSON.stringify(r).slice(0, 100));

  // AI endpoints use rule-based fallbacks with no client configured
  G.configureGemini({ getClient: () => null });
  r = await call('POST', '/search/natural-language', { query: 'react developer remote in india 5 years' }); ok('NL search fallback', r.status === 200 && Array.isArray(r.body.keywords), JSON.stringify(r).slice(0, 160));
  r = await call('POST', '/ai/match', { jobId, profileId: store.getSearchProfiles()[0].id }); ok('AI match fallback', r.status === 200, JSON.stringify(r).slice(0, 160));
  r = await call('POST', '/ai/resume-analysis', { resumeText: 'js ts react node', jobId }); ok('resume analysis fallback', r.status === 200, JSON.stringify(r).slice(0, 160));
  r = await call('POST', '/ai/interview-prep', { role: 'Dev', company: 'Acme', roundName: 'R1' }); ok('interview prep fallback', r.status === 200, JSON.stringify(r).slice(0, 160));
  r = await call('DELETE', '/applications/app-test-1'); ok('DELETE application', r.status === 200 && !store.getApplicationById('app-test-1'), r.status);
  r = await call('GET', '/nope'); ok('unknown route 404', r.status === 404, r.status);
  ok('matchRoute trailing slash', !!H.matchRoute('GET', '/jobs/'), '');

  // synthetic connector shape
  if (SD) { const sr = await SD.runSearchDiscovery('engineer'); ok('search_discovery jobs flagged synthetic', sr.jobs.length > 0 && sr.jobs.every((j) => j.synthetic === true), sr.jobs.length); }

  // reload from persisted state keeps data and does not re-seed
  await store.flush();
  const store2 = new S.JobIntelStore({ persistence: { load: async () => JSON.parse(JSON.stringify(saved)), save: async () => {} }, connectors });
  await store2.init(); ok('reload keeps jobs', store2.getJobs().length === store.getJobs().length, store2.getJobs().length + ' vs ' + store.getJobs().length);
  ok('reload keeps synthetic enabled flag as stored', store2.getSources().find((s) => s.id === 'search_discovery').enabled === true, '');
}
try { await main(); } catch (e) { ok('harness crashed', false, e && e.stack); }
const failed = results.filter((r) => !r.pass);
window.__results = { total: results.length, failed: failed.length, failures: failed };
document.getElementById('out').textContent = `${results.length} checks, ${failed.length} failed\n` + failed.map((f) => '✗ ' + f.name + ' :: ' + f.detail).join('\n');
</script>
