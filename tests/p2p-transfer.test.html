<!doctype html><meta charset="utf-8"><title>Direct P2P transfer end-to-end tests</title>
<!-- Direct P2P end-to-end loopback tests. No Node needed: run in any modern browser with WebRTC.
     How to run: serve the project root (e.g. `python -m http.server 8080` or `node server.js`) and open
     http://localhost:8080/tests/p2p-transfer.test.html - the page prints "N checks, 0 failed" (takes ~20-40 s).
     Two real P2PManager instances (js/lib/p2p/webrtc.js) talk to the REAL signaling hub (server/p2p/core/signaling.js) through fake in-memory
     sockets, and to each other over a real RTCPeerConnection/DataChannel inside this one page (no network, no Supabase, no real files).
     NOT covered here: two different devices/networks, NAT traversal, mobile browsers, real WebSocket + Supabase token verification. -->
<pre id="out">running...</pre>
<script type="module">
import { SignalingHub } from '/server/p2p/core/signaling.js';
import { P2PManager } from '/js/lib/p2p/webrtc.js';
import { formatRoomCode, normalizeRoomCode, extractRoomCode } from '/js/lib/p2p/formatters.js';

const results = [];
const test = async (name, fn) => { try { await fn(); results.push({ name, pass: true }); } catch (e) { results.push({ name, pass: false, detail: (e && e.message) || String(e) }); } };
const eq = (a, b, m) => { if (a !== b) throw new Error((m || 'not equal') + ': got ' + JSON.stringify(a) + ' expected ' + JSON.stringify(b)); };
const ok = (c, m) => { if (!c) throw new Error(m || 'assertion failed'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(cond, ms, what) { const t0 = Date.now(); for (;;) { let v; try { v = cond(); } catch (_) { v = false; } if (v) return v; if (Date.now() - t0 > ms) throw new Error('timeout waiting for ' + (what || 'condition')); await sleep(25); } }

// ---------------------------------------------------------------- fake socket -> real hub
const TOKENS = { 'tok-a': 'user-a', 'tok-b': 'user-b' };
const hub = new SignalingHub({ verifyToken: async (t) => (TOKENS[t] ? { userId: TOKENS[t] } : null), config: { graceMs: 60, authTimeoutMs: 5000, createLimit: { max: 1000, windowMs: 1000 } }, logger: { warn() {}, error() {}, log() {} } });
class FakeSocket {
  constructor() {
    this.readyState = 0; this.onopen = this.onmessage = this.onclose = this.onerror = null;
    this.session = hub.attach({ send: (s) => setTimeout(() => { if (this.readyState === 1 && this.onmessage) this.onmessage({ data: s }); }, 0), close: () => this._closeFromServer(), meta: { networkKey: 'test' } });
    setTimeout(() => { this.readyState = 1; if (this.onopen) this.onopen({}); }, 0);
  }
  send(s) { if (this.readyState !== 1) throw new Error('socket not open'); setTimeout(() => { this.session.onMessage(s); }, 0); }
  close() { if (this.readyState === 3) return; this.readyState = 3; this.session.onClose(); if (this.onclose) setTimeout(() => this.onclose({}), 0); }
  _closeFromServer() { if (this.readyState === 3) return; this.readyState = 3; if (this.onclose) setTimeout(() => this.onclose({}), 0); }
}
const SETTINGS = { iceMode: 'lan-only', autoAcceptTransfers: true, autoDownload: false, enableSoundAlerts: false, enableWakeLock: false, enableVibration: false, chunkSize: 64 * 1024, enableLocalDiscovery: false };
function mkManager(token, extra) {
  const m = new P2PManager({ ...SETTINGS, ...(extra || {}) }, { getToken: async () => token, createSocket: () => new FakeSocket(), getUrl: () => 'ws://fake/p2p-ws' });
  m.errors = []; m.onError = (e) => m.errors.push(e); return m;
}
async function pair(extraA, extraB) {
  const a = mkManager('tok-a', extraA); const b = mkManager('tok-b', extraB);
  let code = null; a.onRoomCreated = (c) => { code = c; };
  a.createRoom(); await waitFor(() => code, 5000, 'room code');
  b.connect(code); await waitFor(() => a.connectionState === 'connected' && b.connectionState === 'connected', 15000, 'both connected');
  return { a, b, code };
}
const sha = async (buf) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map((x) => x.toString(16).padStart(2, '0')).join('');
function randomFile(name, size) { const bytes = new Uint8Array(size); for (let off = 0; off < size; off += 65536) crypto.getRandomValues(bytes.subarray(off, Math.min(size, off + 65536))); return new File([bytes], name, { type: 'application/octet-stream' }); }
const incomingList = (m) => [...m.incomingTransfers.values()];

// ---------------------------------------------------------------- tests
await test('room code helpers', () => {
  eq(formatRoomCode('abcdefgh'), 'ABCD-EFGH'); eq(normalizeRoomCode(' abcd-efgh '), 'ABCDEFGH');
  eq(extractRoomCode('https://x.test/app#p2p?room=ABCD-EFGH'), 'ABCDEFGH'); eq(extractRoomCode('?room=abcdefgh'), 'ABCDEFGH'); eq(extractRoomCode('PIN: ABCD EFGH'), 'ABCDEFGH'); eq(extractRoomCode('ABCDEFGH'), 'ABCDEFGH');
});

await test('auth failure: bad token fails with a clear error and no room', async () => {
  const bad = mkManager('nope'); bad.createRoom(); await waitFor(() => bad.connectionState === 'failed', 5000, 'failed state'); ok(bad.errors.length > 0, 'error reported'); eq(hub.rooms.size >= 0, true);
  bad.disconnect();
});
await test('joining an unknown room fails (room-not-found) instead of creating one', async () => {
  const b = mkManager('tok-b'); const before = hub.rooms.size; b.connect('ZZZZZZZZ'); await waitFor(() => b.connectionState === 'failed', 5000, 'failed'); ok(/no transfer room|not found|check/i.test(b.errors.join(' ')), 'message: ' + b.errors.join('|')); eq(hub.rooms.size, before); b.disconnect();
});

let P = null;
await test('create room + join: both peers reach "connected" over a real WebRTC link', async () => {
  P = await pair(); eq(P.code.length, 8); ok(P.a.isInitiator && !P.b.isInitiator);
});
await test('control channel is reliable & ordered; file channel has NO maxRetransmits (fix B)', async () => {
  const dc = P.a.fileDc; ok(dc, 'file channel'); eq(dc.ordered, true); eq(dc.maxRetransmits, null, 'no maxRetransmits'); eq(dc.maxPacketLifeTime, null);
});
await test('effective chunk size never exceeds the SCTP limit (fix E)', async () => {
  P.a.updateSettings({ chunkSize: 512 * 1024 }); const eff = P.a.getEffectiveChunkSize(); const max = P.a.pc.sctp && P.a.pc.sctp.maxMessageSize; ok(eff <= (isFinite(max) && max > 0 ? max : 65536), `eff ${eff} max ${max}`); ok(eff >= 16 * 1024); P.a.updateSettings({ chunkSize: 64 * 1024 });
});
await test('chat message arrives at the peer', async () => {
  P.a.sendChatMessage('hello <b>peer</b>'); await waitFor(() => P.b.messages.some((m) => m.sender !== 'me' && m.sender !== 'system' && m.text === 'hello <b>peer</b>'), 5000, 'chat');
});
await test('3 MB file: sender completes, receiver completes, bytes identical (SHA-256), progress 100%', async () => {
  const f = randomFile('three.bin', 3 * 1024 * 1024 + 123); const expected = await sha(await f.arrayBuffer());
  P.a.addFilesToQueue([f]); const item = P.a.fileQueue[P.a.fileQueue.length - 1]; await P.a.startNextTransfer();
  const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'three.bin' && i.status === 'completed'), 30000, 'receiver completed');
  await waitFor(() => item.status === 'completed', 10000, 'sender completed'); const got = P.b.getReceivedFile(inc.id); ok(got, 'received file available'); eq(got.size, f.size, 'size');
  eq(await sha(await got.arrayBuffer()), expected, 'sha256'); eq(Math.round(inc.progress), 100); eq(Math.round(item.progress), 100);
});
await test('zero-byte and tiny files transfer correctly', async () => {
  const z = new File([new Uint8Array(0)], 'empty.txt', { type: 'text/plain' }); const t = new File([new TextEncoder().encode('héllo ✓')], 'tiny.txt', { type: 'text/plain' });
  P.a.addFilesToQueue([z, t]); await P.a.startNextTransfer();
  const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'tiny.txt' && i.status === 'completed'), 20000, 'tiny completed'); eq(await P.b.getReceivedFile(inc.id).text(), 'héllo ✓');
  const e = await waitFor(() => incomingList(P.b).find((i) => i.name === 'empty.txt' && i.status === 'completed'), 20000, 'empty completed'); eq(P.b.getReceivedFile(e.id).size, 0);
});
await test('manual accept: transfer waits in pending-approval until accepted', async () => {
  P.b.updateSettings({ autoAcceptTransfers: false }); const f = randomFile('manual.bin', 200 * 1024); const expected = await sha(await f.arrayBuffer());
  P.a.addFilesToQueue([f]); await P.a.startNextTransfer(); const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'manual.bin'), 10000, 'proposal'); eq(inc.status, 'pending-approval'); await sleep(300); eq(inc.status, 'pending-approval', 'does not start without accept');
  P.b.acceptIncomingTransfer(inc.id); await waitFor(() => inc.status === 'completed', 20000, 'completed after accept'); eq(await sha(await P.b.getReceivedFile(inc.id).arrayBuffer()), expected);
});
await test('reject: sender item reports the rejection, nothing is saved', async () => {
  const f = randomFile('rejected.bin', 100 * 1024); P.a.addFilesToQueue([f]); const item = P.a.fileQueue[P.a.fileQueue.length - 1]; await P.a.startNextTransfer();
  const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'rejected.bin'), 10000, 'proposal'); await P.b.rejectIncomingTransfer(inc.id, 'No thanks'); await waitFor(() => item.status === 'error', 10000, 'sender sees rejection'); ok(/No thanks|reject|declin/i.test(item.error || ''), 'reason: ' + item.error); eq(P.b.getReceivedFile(inc.id) || null, null);
  P.b.updateSettings({ autoAcceptTransfers: true });
});
await test('integrity failure: a corrupted chunk FAILS the transfer, nothing is saved, sender is told (fix C)', async () => {
  const f = randomFile('corrupt.bin', 400 * 1024); const orig = P.b.handleIncomingChunk.bind(P.b); let flipped = false;
  P.b.handleIncomingChunk = (data) => { if (!flipped) { flipped = true; const copy = new Uint8Array(data.byteLength !== undefined ? data.slice(0) : data); copy[10] ^= 0xff; return orig(copy.buffer); } return orig(data); };
  P.a.addFilesToQueue([f]); const item = P.a.fileQueue[P.a.fileQueue.length - 1]; await P.a.startNextTransfer();
  const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'corrupt.bin' && (i.status === 'error' || i.status === 'completed')), 30000, 'receiver outcome');
  P.b.handleIncomingChunk = orig; eq(inc.status, 'error', 'must fail'); ok(/Integrity check failed/.test(inc.error || ''), 'error text: ' + inc.error); eq(P.b.getReceivedFile(inc.id) || null, null, 'no file exposed'); ok(!inc.blobUrl, 'no blob url');
  await waitFor(() => item.status === 'error', 10000, 'sender marked failed'); ok(/Integrity/i.test(item.error || ''), 'sender error: ' + item.error);
});
await test('after an integrity failure the link still works for a clean transfer', async () => {
  const f = randomFile('after.bin', 150 * 1024); const expected = await sha(await f.arrayBuffer()); P.a.addFilesToQueue([f]); await P.a.startNextTransfer();
  const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'after.bin' && i.status === 'completed'), 20000, 'completed'); eq(await sha(await P.b.getReceivedFile(inc.id).arrayBuffer()), expected);
});
await test('pause and resume a large transfer: file arrives intact', async () => {
  const f = randomFile('pausable.bin', 12 * 1024 * 1024); const expected = await sha(await f.arrayBuffer()); P.a.addFilesToQueue([f]); const item = P.a.fileQueue[P.a.fileQueue.length - 1]; await P.a.startNextTransfer();
  await waitFor(() => item.status === 'transferring' && item.bytesTransferred > 256 * 1024, 20000, 'transfer underway');
  P.a.pauseTransfer(item.id); await waitFor(() => item.status === 'paused', 5000, 'sender paused'); const at = item.bytesTransferred; await sleep(400); ok(item.bytesTransferred - at < 2 * 1024 * 1024, 'progress (nearly) stopped while paused');
  await P.a.resumeTransfer(item.id);
  const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'pausable.bin' && i.status === 'completed'), 60000, 'completed after resume'); eq(await sha(await P.b.getReceivedFile(inc.id).arrayBuffer()), expected, 'sha256 after pause/resume');
});
await test('cancel: the sender can cancel a running transfer and the receiver does not keep it', async () => {
  const f = randomFile('cancelled.bin', 12 * 1024 * 1024); P.a.addFilesToQueue([f]); const item = P.a.fileQueue[P.a.fileQueue.length - 1]; await P.a.startNextTransfer();
  await waitFor(() => item.status === 'transferring' && item.bytesTransferred > 128 * 1024, 20000, 'underway'); P.a.cancelTransfer(item.id);
  const inc = await waitFor(() => incomingList(P.b).find((i) => i.name === 'cancelled.bin' && i.status !== 'transferring'), 10000, 'receiver stops'); ok(inc.status === 'cancelled' || inc.status === 'error', 'receiver status ' + inc.status); eq(P.b.getReceivedFile(inc.id) || null, null);
});
await test('stats and device info are populated', async () => {
  await waitFor(() => P.a.remoteDeviceInfo && P.a.currentStats && P.a.currentStats.bytesSent > 0, 8000, 'stats'); ok(P.a.localDeviceInfo);
});
await test('disconnect: peer is told (waiting-peer) and the room is cleaned up', async () => {
  const code = P.code; P.a.disconnect(); eq(P.a.connectionState, 'disconnected'); await waitFor(() => P.b.connectionState === 'waiting-peer' || P.b.connectionState === 'disconnected' || P.b.connectionState === 'failed', 15000, 'peer notices');
  P.b.disconnect(); await sleep(200); ok(!hub.rooms.has(code), 'room removed');
});
await test('a third device cannot join a full room', async () => {
  const { a, b, code } = await pair(); const c = mkManager('tok-b'); c.connect(code); await waitFor(() => c.connectionState === 'failed', 8000, 'third peer refused'); ok(/full/i.test(c.errors.join(' ')), 'message: ' + c.errors.join('|')); a.disconnect(); b.disconnect(); c.disconnect();
});

const failed = results.filter((r) => !r.pass);
window.__results = { total: results.length, failed: failed.length, failures: failed };
document.getElementById('out').textContent = `${results.length} checks, ${failed.length} failed\n` + failed.map((f) => '✗ ' + f.name + ' :: ' + f.detail).join('\n');
</script>
